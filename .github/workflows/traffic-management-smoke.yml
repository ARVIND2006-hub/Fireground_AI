name: Traffic Management RTL Smoke Tests

on:
  push:
    paths:
      - "projects/advanced-adaptive-traffic-management/**"
      - ".github/workflows/traffic-management-smoke.yml"
  pull_request:
    paths:
      - "projects/advanced-adaptive-traffic-management/**"
      - ".github/workflows/traffic-management-smoke.yml"
  workflow_dispatch:

jobs:
  iverilog-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Check register-map consistency
        run: python3 projects/advanced-adaptive-traffic-management/scripts/check_register_map.py
      - name: Run digital-twin unit tests
        run: python3 -m unittest discover -s projects/advanced-adaptive-traffic-management/software/sim -p "test_*.py"
      - name: Generate digital-twin example report
        run: python3 projects/advanced-adaptive-traffic-management/software/sim/traffic_digital_twin.py --output build/traffic_digital_twin_report.json
      - name: Run controller and AXI smoke tests
        run: bash projects/advanced-adaptive-traffic-management/scripts/run_smoke_tests.sh
